    fontes:
      - titulo: Balanço de governo aponta 26 promessas cumpridas — News Rondônia
        url: https://newsrondonia.com.br/politica/2026/07/22/balanco-de-governo-de-lula-aponta-26-promessas-cumpridas/
    verificado: true

  - titulo: Zerar o desmatamento na Amazônia até 2030
    tema: Meio ambiente
    status: em_andamento
    analise: O desmatamento caiu (–11% no ciclo 2024/2025, segundo o Prodes), mas a meta é para 2030.
    fontes:
      - titulo: TerraBrasilis — Inpe
        url: https://terrabrasilis.dpi.inpe.br/
