numero: 3
presidente: Luiz Inácio Lula da Silva
inicio: 2023
fim: 2026
eleicao: 2022
resumo: >-
  Levantamento do g1 até 30/06/2026 avaliou 36 compromissos de 2022: 26 cumpridos, 4 parciais
  e 6 não cumpridos (cerca de 78% pelo critério deste site). A classificação é editorial, não
  auditoria oficial. Abaixo estão só os principais itens, por isso o placar desta página é
  menor que o do levantamento completo.

promessas:
  - titulo: Isentar do Imposto de Renda quem ganha até R$ 5 mil por mês
    tema: Economia
    status: cumprida
    analise: Aprovada pelo Congresso; a isenção passou a valer nos salários a partir de janeiro de 2026.
    fontes:
      - titulo: Promessas de Lula (levantamento g1) — Fenafisco
        url: https://fenafisco.org.br/23/07/2026/promessas-de-lula-governo-aprovou-reforma-tributaria-e-isencao-do-ir-e-nao-recriou-ministerio-da-seguranca/
    verificado: true

  - titulo: Aprovar a reforma tributária
    tema: Economia
    status: cumprida
    analise: >-
      Aprovada, com criação da CBS e do IBS, cashback para famílias de baixa renda e desoneração
      da cesta básica. A transição para o novo sistema se estende até a próxima década.
    fontes:
      - titulo: Promessas de Lula (levantamento g1) — Fenafisco
        url: https://fenafisco.org.br/23/07/2026/promessas-de-lula-governo-aprovou-reforma-tributaria-e-isencao-do-ir-e-nao-recriou-ministerio-da-seguranca/
    verificado: true

  - titulo: Retomar o Mais Médicos
    tema: Saúde
    status: cumprida
    analise: Programa retomado com editais e contratação de médicos para áreas vulneráveis.
    fontes:
      - titulo: Balanço de três anos — ND+
        url: https://ndmais.com.br/politica/promessas-de-lula-balanco-tres-anos-governo/
    verificado: true

  - titulo: Retomar o Minha Casa, Minha Vida
    tema: Habitação
    status: cumprida
    fontes:
      - titulo: Balanço de governo aponta 26 promessas cumpridas — News Rondônia
        url: https://newsrondonia.com.br/politica/2026/07/22/balanco-de-governo-de-lula-aponta-26-promessas-cumpridas/
    verificado: true

  - titulo: Ampliar o Farmácia Popular
    tema: Saúde
    status: cumprida
    analise: Gratuidade integral para os itens do programa e inclusão de novos medicamentos.
    fontes:
      - titulo: Balanço de três anos — ND+
        url: https://ndmais.com.br/politica/promessas-de-lula-balanco-tres-anos-governo/
    verificado: true

