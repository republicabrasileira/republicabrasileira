  - titulo: '"Voltar a comer picanha e tomar cerveja" — baratear a comida'
    tema: Custo de vida
    status: nao_cumprida
    analise: >-
      Frase de campanha, não item formal do plano. A Gazeta do Povo a lista como não cumprida;
      o g1 não a incluiu no levantamento.
    fontes:
      - titulo: Lula disse, mas não fez — Gazeta do Povo
