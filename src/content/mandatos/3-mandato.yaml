    tema: Saúde
    status: parcial
    analise: >-
      O programa de redução de filas realizou parte das cirurgias represadas, mas as filas não
      acabaram.
    fontes:
      - titulo: Balanço de três anos — ND+
        url: https://ndmais.com.br/politica/promessas-de-lula-balanco-tres-anos-governo/
    verificado: true

