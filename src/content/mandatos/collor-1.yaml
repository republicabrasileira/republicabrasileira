presidente: collor
ordem: 1
forma: direta
inicio: 1990
fim: 1992
eleicao: 1989
resumo: >-
  Primeira eleição direta desde 1960. Não há plano de governo registrado como hoje; as promessas vêm dos
  slogans e compromissos da campanha de 1989, como "caçar marajás" e "modernizar o Brasil". Mandato
  interrompido pela renúncia em 29 de dezembro de 1992, durante o impeachment.

promessas:
  - titulo: Caçar os "marajás" — acabar com privilégios e corrupção no setor público
    tema: Gestão pública
    status: nao_cumprida
    analise: >-
      Foi o principal slogan da campanha. O mandato terminou num processo de impeachment motivado pelo
      esquema de corrupção do seu tesoureiro, PC Farias. Em 2025, Collor foi preso após condenação do STF
      por corrupção em outro caso.
    fontes:
      - titulo: De caçador de marajás a preso — Congresso em Foco
        url: https://www.congressoemfoco.com.br/noticia/108064/de-cacador-de-marajas-a-preso-a-ascensao-e-queda-de-collor
    verificado: true

  - titulo: Não confiscar a poupança
    tema: Economia
    status: nao_cumprida
    analise: >-
      Na campanha de 1989, Collor acusou Lula de planejar confiscar a poupança. Em 16 de março de 1990, um
      dia após a posse, o Plano Collor bloqueou cerca de 80% dos depósitos por 18 meses. Collor depois
      negou ter prometido preservar a poupança: "Eu nunca afirmei isso".
    fontes:
      - titulo: Plano Collor, 36 anos — Jornal Opção
        url: https://www.jornalopcao.com.br/reportagens/plano-collor-36-anos-o-dia-em-que-o-brasil-acordou-confiscado-805625/
    verificado: true

  - titulo: Derrotar a inflação
    tema: Economia
    status: nao_cumprida
    analise: >-
      Collor dizia que mataria a inflação "com um tiro só". Ela caiu logo após o Plano Collor, mas voltou a
      subir, e o IPCA ficou acima de 400% ao ano em todos os anos do mandato. A estabilização só veio com
      o Plano Real, em 1994.
    fontes:
      - titulo: Plano Collor, 36 anos — Jornal Opção
        url: https://www.jornalopcao.com.br/reportagens/plano-collor-36-anos-o-dia-em-que-o-brasil-acordou-confiscado-805625/
      - titulo: Tabela histórica do IPCA — Numerando (dados IBGE/BCB)
        url: https://numerando.com.br/indices/ipca/tabela-completa
    verificado: true

  - titulo: Modernizar e abrir a economia
    tema: Economia
    status: cumprida
    analise: >-
      A modernização foi a outra bandeira da campanha. O governo eliminou a maior parte das barreiras não
      tarifárias e baixou a tarifa média de importação de cerca de 32% para 14% em três anos.
    fontes:
      - titulo: Abertura comercial e agricultura — Instituto de Economia Agrícola (SP)
        url: https://iea.agricultura.sp.gov.br/ftpiea/ie/2001/tec3-0301.pdf
    verificado: true

  - titulo: Começar as privatizações
    tema: Economia
    status: cumprida
    analise: >-
      O Programa Nacional de Desestatização foi criado em 1990 (Lei 8.031), e a primeira grande venda,
      a Usiminas, ocorreu em outubro de 1991.
    fontes:
      - titulo: Lei 8.031, de 1990 — Planalto
        url: https://www.planalto.gov.br/ccivil_03/leis/l8031.htm
      - titulo: Histórico das desestatizações — BNDES
        url: https://www.bndes.gov.br/wps/portal/site/home/transparencia/desestatizacao/processos-encerrados/Historico
    verificado: true
