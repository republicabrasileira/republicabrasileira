resumo: >-
  Itamar foi eleito vice na chapa de Collor e assumiu com o impeachment. Ele nunca fez campanha nem
  apresentou plano próprio para presidente, por isso esta página não tem promessas a cobrar e ele não
  entra no placar. O principal legado do governo é o Plano Real, lançado em julho de 1994.
