presidente: lula
ordem: 1
forma: direta
inicio: 2003
fim: 2006
eleicao: 2002
resumo: >-
  Eleito com o programa "Um Brasil para Todos". A campanha divulgou metas numéricas,
  como a de 10 milhões de empregos, que o próprio Lula depois disse não ter sido promessa. Em 2006, a
  revista Época analisou 111 promessas e deu nota média 5,2 ao cumprimento.

promessas:
  - titulo: Criar 10 milhões de empregos
    tema: Economia
    status: nao_cumprida
    analise: >-
      O caderno de campanha "Mais e Melhores Empregos" (2002) propunha mecanismos para
      chegar a 10 milhões de empregos até 2006. Pelo Caged, foram criados cerca de
      4,65 milhões de empregos com carteira entre 2003 e 2006. Mesmo a estimativa do
      próprio governo (8,5 milhões, incluindo informais) ficou abaixo da meta. Em 2005,
      Lula afirmou que o programa "não prometia" o número, apenas dizia que o país precisava dele.
    fontes:
      - titulo: Sob Lula, país criou 4,6 milhões de empregos formais — Congresso em Foco
        url: https://www.congressoemfoco.com.br/noticia/86779/sob-lula-pais-criou-4-6-milhoes-de-empregos-formais
      - titulo: O emprego no governo Lula — Congresso em Foco
        url: https://www.congressoemfoco.com.br/noticia/103640/o-emprego-no-governo-lula
    verificado: true

  - titulo: Fome Zero — garantir três refeições por dia a todos os brasileiros
    tema: Social
    status: parcial
    analise: >-
      O Fome Zero foi lançado em 2003, mas não funcionou como planejado e acabou absorvido
      pelo Bolsa Família (2003/2004), que se tornou o principal programa de transferência
      de renda. O desenho original, com cupons de alimentação, cestas básicas e frentes de trabalho, foi
      abandonado por ser impraticável, segundo o balanço da revista Época em 2006.
    fontes:
      - titulo: Revista Época faz balanço das promessas de Lula; nota foi 5,2 — Alagoas 24 Horas
        url: https://www.alagoas24horas.com.br/848187/revista-epoca-faz-balanco-das-promessas-de-lula-nota-foi-52/
    verificado: true

  - titulo: Programa Primeiro Emprego para jovens
    tema: Trabalho
    status: nao_cumprida
    analise: >-
      Lançado em 2003, o governo anunciava atender 150 mil jovens no primeiro ano e 450 mil até o fim de
      2004. Os dados da PNAD e do Ministério do Trabalho confirmaram o fracasso do programa.
    fontes:
      - titulo: O emprego no governo Lula — Congresso em Foco
        url: https://www.congressoemfoco.com.br/noticia/103640/o-emprego-no-governo-lula
      - titulo: O governo federal acaba de anunciar o Programa do Primeiro Emprego — Monitor Mercantil
        url: https://monitormercantil.com.br/o-governo-federal-acaba-de-anunciar-o-programa-do-primeiro-emprego-como/
    verificado: true

  - titulo: Crescer em média 5% ao ano
    tema: Economia
    status: nao_cumprida
    analise: >-
      A promessa de 2002 era de crescimento médio de 5% ao ano. Em setembro de 2006, a revista Época
      concluiu que a meta continuava fora de alcance; a média do mandato ficou abaixo disso.
    fontes:
      - titulo: Revista Época faz balanço das promessas de Lula; nota foi 5,2 — Alagoas 24 Horas
        url: https://www.alagoas24horas.com.br/848187/revista-epoca-faz-balanco-das-promessas-de-lula-nota-foi-52/
    verificado: true

  - titulo: Dobrar o poder de compra do salário mínimo em quatro anos
    tema: Trabalho
    status: nao_cumprida
    analise: >-
      Logo no início do governo, o líder no Senado, Aloizio Mercadante, admitiu que não seria possível
      dobrar o poder de compra no mandato. O mínimo teve ganho real expressivo, mas o aumento acumulado
      até 2010, já no fim do segundo mandato, foi de cerca de 54% acima da inflação, longe de dobrar.
    fontes:
      - titulo: Pronunciamento no Senado sobre a promessa do salário mínimo — Senado Federal
        url: https://www25.senado.leg.br/web/atividade/pronunciamentos/-/p/pronunciamento/346632
    verificado: false

  - titulo: Manter a inflação sob controle (Carta ao Povo Brasileiro)
    tema: Economia
    status: cumprida
    analise: >-
      Na Carta ao Povo Brasileiro, de junho de 2002, Lula se comprometeu a manter a inflação sob controle e
      o superávit primário necessário para a dívida não crescer. O IPCA, que fechou 2002 em 12,53% com a
      alta do dólar na eleição, caiu para 9,30% em 2003, 7,60% em 2004, 5,69% em 2005 e 3,14% em 2006.
    fontes:
      - titulo: Controle da inflação resiste a pressões políticas e torna-se trunfo de petista — Senado (clipping)
        url: https://www2.senado.leg.br/jspui/bitstream/id/353493/1/noticia.htm
      - titulo: Tabela histórica do IPCA — Numerando (dados IBGE/BCB)
        url: https://numerando.com.br/indices/ipca/tabela-completa
    verificado: true

  - titulo: Assentar 400 mil famílias na reforma agrária até 2006
    tema: Agricultura
    status: parcial
    analise: >-
      A reforma agrária era uma das principais bandeiras de 2002, e a meta de 400 mil famílias foi fixada no
      Plano Nacional de Reforma Agrária de novembro de 2003. O Ministério do Desenvolvimento Agrário
      informou 381.419 famílias no mandato, 4,65% abaixo da meta. O MST contesta o número, porque ele
      inclui regularização de posses antigas e reposição de famílias que deixaram lotes.
    fontes:
      - titulo: Brasil, insatisfação com a reforma agrária — IPS
        url: https://www.ipsnews.net/portuguese/2007/03/america-latina/brasil-insatisfacao-com-a-reforma-agraria/
      - titulo: Governo ainda promete assentar 400 mil famílias — Tribuna do Paraná
        url: https://www.tribunapr.com.br/noticias/brasil/governo-ainda-promete-assentar-400-mil-familias/amp/
    verificado: true
