nome: Fernando Henrique Cardoso
nomeCompleto: Fernando Henrique Cardoso
partido: PSDB
resumo: >-
  Ministro da Fazenda no lançamento do Plano Real, foi eleito em 1994 e reeleito em 1998 no primeiro
  turno, depois da emenda constitucional que criou a reeleição (1997). Seu governo fez privatizações,
  aprovou a Lei de Responsabilidade Fiscal (2000) e enfrentou a desvalorização do real em janeiro de 1999.
