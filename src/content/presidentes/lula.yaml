nome: Lula
nomeCompleto: Luiz Inácio Lula da Silva
partido: PT
resumo: >-
  Ex-metalúrgico e sindicalista, perdeu as eleições de 1989, 1994 e 1998 e venceu em 2002, 2006, 2022 e
  2026, o único presidente eleito quatro vezes pelo voto direto. Ficou preso de 2018 a 2019 pela Lava
  Jato; as condenações foram anuladas pelo STF em 2021.
