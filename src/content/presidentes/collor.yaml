nome: Fernando Collor
nomeCompleto: Fernando Affonso Collor de Mello
partido: PRN
resumo: >-
  Primeiro presidente eleito pelo voto direto desde 1960, venceu Lula no segundo turno de 1989 com o
  discurso de "caçador de marajás". No dia seguinte à posse, o Plano Collor bloqueou cerca de 80% da
  poupança. Renunciou em 29 de dezembro de 1992, durante o processo de impeachment; o Senado suspendeu
  seus direitos políticos por oito anos. Em 2025 foi preso após condenação do STF por corrupção.
fontes:
