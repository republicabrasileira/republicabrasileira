nome: José Sarney
nomeCompleto: José Sarney de Araújo Costa
partido: PMDB
resumo: >-
  Vice na chapa de Tancredo Neves, eleita pelo Colégio Eleitoral em 15 de janeiro de 1985, o fim da
  ditadura militar. Tancredo adoeceu na véspera da posse e morreu em 21 de abril de 1985; Sarney assumiu.
  O governo foi marcado pela Constituição de 1988, pelo Plano Cruzado (1986) e pela hiperinflação no fim
  do mandato.
fontes:
