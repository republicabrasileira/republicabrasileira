nome: Jair Bolsonaro
nomeCompleto: Jair Messias Bolsonaro
partido: PSL (2018) / PL (2022)
resumo: >-
  Capitão reformado do Exército e deputado federal por 28 anos, foi eleito em 2018 e perdeu a reeleição
  para Lula em 2022. Está inelegível por decisão do TSE (2023). Em 2025 foi condenado pelo STF a 27 anos e
  3 meses por tentativa de golpe de Estado; cumpre prisão domiciliar humanitária desde 2026.
fontes:
