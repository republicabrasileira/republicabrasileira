nome: Itamar Franco
nomeCompleto: Itamar Augusto Cautiero Franco
partido: Sem partido (eleito vice pelo PRN)
resumo: >-
  Vice de Collor. Assumiu interinamente em outubro de 1992, com o afastamento de Collor, e em definitivo
  com a renúncia em dezembro. Seu governo lançou o Plano Real (1994), com Fernando Henrique Cardoso no
  Ministério da Fazenda. Como não foi eleito presidente, não apresentou plano de governo.
