nome: Dilma Rousseff
nomeCompleto: Dilma Vana Rousseff
partido: PT
resumo: >-
  Primeira mulher a presidir o Brasil, eleita em 2010 e reeleita em 2014. Foi afastada em 12 de maio de
  2016 e cassada pelo Senado em 31 de agosto de 2016 por crime de responsabilidade (pedaladas fiscais e
  decretos de crédito sem autorização do Congresso), sem perder os direitos políticos.
